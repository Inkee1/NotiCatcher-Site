<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NotiCatcher - Never Miss Important Notifications with Alarms</title>
    <meta name="description" content="Never miss important notifications. NotiCatcher bypasses silent mode and delivers powerful keyword alerts." />
    <link rel="canonical" href="https://noticatcher.com/" />
    <link rel="alternate" hreflang="x-default" href="https://noticatcher.com/" />
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .loader {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<link href="/img/appicon.png" rel="icon" type="image/png"/>
<meta content="NotiCatcher - Never Miss Important Notifications with Alarms" property="og:title"/>
<meta content="Never miss important notifications. NotiCatcher bypasses silent mode and delivers powerful keyword alerts." property="og:description"/>
<meta content="website" property="og:type"/>
<meta content="https://noticatcher.com/" property="og:url"/>
<meta content="https://noticatcher.com/img/main1.jpg" property="og:image"/>
<meta content="NotiCatcher" property="og:site_name"/>
<meta content="summary_large_image" name="twitter:card"/>
<meta content="NotiCatcher - Never Miss Important Notifications with Alarms" name="twitter:title"/>
<meta content="Never miss important notifications. NotiCatcher bypasses silent mode and delivers powerful keyword alerts." name="twitter:description"/>
<meta content="https://noticatcher.com/img/main1.jpg" name="twitter:image"/>
</head>
<body>
    <div class="loader"></div>
    <noscript>
        <a href="/en/">Go to English site</a>
    </noscript>
    <script>
        const SUPPORTED = ["en", "am", "ar", "bg", "bn", "cs", "da", "de", "el", "es", "es-419", "et", "fa", "fi", "fil", "fr", "gu", "he", "hi", "hr", "hu", "id", "it", "ja", "km", "kn", "ko", "lo", "lt", "lv", "ml", "mr", "ms", "my", "nl", "no", "pa", "pl", "pt", "pt-br", "ro", "ru", "sk", "sl", "sr", "sv", "sw", "ta", "te", "th", "tr", "uk", "ur", "vi", "zh", "zh-hans", "zh-hant"];
        const ALIASES = { "ko-kr": "ko" };
        const MANUAL_STORAGE_KEY = "lang_manual";

        function normalize(tag) {
            return tag ? tag.toLowerCase().replace(/_/g, "-") : "";
        }

        function resolve(tag) {
            let t = normalize(tag);
            if (!t) return "";
            if (ALIASES[t]) t = ALIASES[t];
            if (SUPPORTED.includes(t)) return t;
            
            while (t.includes("-")) {
                t = t.substring(0, t.lastIndexOf("-"));
                if (ALIASES[t]) t = ALIASES[t];
                if (SUPPORTED.includes(t)) return t;
            }
            return SUPPORTED.includes(t) ? t : "";
        }

        function getStoredManualLang() {
            try {
                return localStorage.getItem(MANUAL_STORAGE_KEY);
            } catch (_) {
                return "";
            }
        }

        function pickBestLang() {
            const qsLang = new URLSearchParams(location.search).get("lang");
            const manual = getStoredManualLang();

            let r = resolve(qsLang);
            if (r) return r;

            r = resolve(manual);
            if (r) return r;

            const list = (navigator.languages && navigator.languages.length)
                ? navigator.languages
                : [navigator.language || "en"];

            for (const l of list) {
                r = resolve(l);
                if (r) return r;
            }

            return "en";
        }

        const lang = pickBestLang();
        const target = new URL(lang + "/", location.href).toString();

        // Defensive: if a language folder is missing (future locales / partial deploy),
        // don't redirect into a cached 404 loop. Fall back to English.
        fetch(target, { method: "HEAD", cache: "no-store" })
            .then((r) => {
                if (r && r.ok) {
                    location.replace(target);
                    return;
                }
                location.replace(new URL("en/", location.href).toString());
            })
            .catch(() => {
                location.replace(new URL("en/", location.href).toString());
            });
    </script>
</body>
</html>
